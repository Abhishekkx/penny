<script>
        document.addEventListener('DOMContentLoaded', () => {
            const carousel = document.getElementById('carousel');
            const slides = document.querySelectorAll('.carousel-slide');
            const nextBtn = document.getElementById('nextBtn');
            const skipBtn = document.getElementById('skipBtn');
            const dots = document.getElementById('progressDots').children;
            let currentSlide = 0;

            const updateUI = () => {
                // Update dots
                Array.from(dots).forEach((dot, index) => {
                    if (index === currentSlide) {
                        dot.classList.remove('bg-surface-variant', 'w-2');
                        dot.classList.add('bg-primary', 'w-6');
                    } else {
                        dot.classList.remove('bg-primary', 'w-6');
                        dot.classList.add('bg-surface-variant', 'w-2');
                    }
                });

                // Update Buttons
                if (currentSlide === slides.length - 1) {
                    nextBtn.textContent = 'Start';
                    skipBtn.classList.add('opacity-0', 'pointer-events-none');
                } else {
                    nextBtn.textContent = 'Next';
                    skipBtn.classList.remove('opacity-0', 'pointer-events-none');
                }
            };

            const scrollToSlide = (index) => {
                if (index >= 0 && index < slides.length) {
                    slides[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
                    currentSlide = index;
                    updateUI();
                }
            };

            nextBtn.addEventListener('click', () => {
                if (currentSlide < slides.length - 1) {
                    scrollToSlide(currentSlide + 1);
                } else {
                    // Start action
                    console.log('App Started');
                }
            });

            skipBtn.addEventListener('click', () => {
                scrollToSlide(slides.length - 1);
            });

            // Handle manual scrolling updates
            carousel.addEventListener('scroll', () => {
                const newIndex = Math.round(carousel.scrollLeft / carousel.offsetWidth);
                if (newIndex !== currentSlide) {
                    currentSlide = newIndex;
                    updateUI();
                }
            });
            
            // Initialize
            updateUI();
        });
    </script>
